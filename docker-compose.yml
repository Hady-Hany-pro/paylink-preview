services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: paylink-api

    ports:
      - "8000:8000"

    depends_on:
      sqlserver:
        condition: service_healthy

    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest

    container_name: paylink-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null || exit 1

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    restart: unless-stopped

volumes:
  sqlserver_data: